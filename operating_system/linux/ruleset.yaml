    elif command -v debsums >/dev/null; then sudo debsums -c 2>&1 | wc -l;
    elif command -v pacman >/dev/null; then sudo pacman -Qk | grep -v '0 missing files' | wc -l;
    else echo 0; fi
  expected: 0
  sudo: true
